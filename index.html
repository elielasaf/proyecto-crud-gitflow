<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto CRUD - Git Flow</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; text-align: center; }
        .dashboard { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sistema CRUD</h1>
        <div id="login-section">
            <h3>Bienvenido al sistema</h3>
            <p>Por favor, ingrese sus datos para continuar.</p>
        </div>
        <div class="dashboard" id="user-dashboard">
            <h2>Panel de Usuario (Dashboard)</h2>
            <p>Aquí se visualizarán y administrarán los registros del sistema.</p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
